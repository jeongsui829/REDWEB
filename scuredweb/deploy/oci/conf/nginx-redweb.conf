# Include within nginx http {}; nginx -t before reload.
server_tokens off;
limit_req_zone $binary_remote_addr zone=redweb_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=redweb_connections:10m;
ssl_protocols TLSv1.2 TLSv1.3;
client_body_temp_path /srv/redweb/scratch/nginx-body 1 2;
client_body_timeout 20s;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name REDWEB_TEST_HOST;
    return 301 https://REDWEB_TEST_HOST$request_uri;
}

server {
    listen 443 ssl http2;
    server_name REDWEB_TEST_HOST;
    # A known SNI must not allow an unrelated HTTP Host to reach the app.
    if ($host != REDWEB_TEST_HOST) { return 444; }

    ssl_certificate /etc/letsencrypt/live/REDWEB_TEST_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REDWEB_TEST_HOST/privkey.pem;

    client_max_body_size 110m;
    limit_req zone=redweb_requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn redweb_connections 20;
    # Enable only after certificate, domain and HTTPS validation; no preload/includeSubDomains.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location = /scuredweb/health {
        allow 127.0.0.1;
        allow ::1;
        # allow MONITORING_CIDR;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /health { return 404; }
    # Health servlet path variants must not fall through to the public proxy.
    location ~ ^/scuredweb/health[;/] { deny all; }


    # Choose one restriction before sharing the URL.
    # auth_basic "REDWEB limited test";
    # auth_basic_user_file /etc/nginx/redweb-test.htpasswd;
    # allow TESTER_PUBLIC_IP;
    # deny all;

    location = / {
        return 302 /scuredweb/;
    }

    location /scuredweb/ {
        proxy_pass http://127.0.0.1:8080/scuredweb/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
    }
}
