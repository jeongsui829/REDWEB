# Optional production setting.
# Full public application base URL. Include the context path if the app is deployed under one.
# Production must use HTTPS. HTTP is accepted only for localhost development.
# Examples:
# app.publicBaseUrl=https://www.example.com/scuredweb
# Local development only:
# app.publicBaseUrl=http://localhost:8080/scuredweb

# Explicit malformed/empty public URLs fail startup. System property redweb.publicBaseUrl
# overrides REDWEB_PUBLIC_BASE_URL, which overrides app.publicBaseUrl.
# Public registration defaults to true only when unconfigured; production runtime
# must set REDWEB_PUBLIC_REGISTRATION_ENABLED=false (or redweb.publicRegistrationEnabled).
