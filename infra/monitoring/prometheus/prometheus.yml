global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  - job_name: "node"
    static_configs:
      - targets:
          - "127.0.0.1:9100"
        labels:
          server: "redweb-cloudv"
  - job_name: "tomcat"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "127.0.0.1:9404"
        labels:
          server: "redweb-cloudv"

  - job_name: "oracle"
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets:
          - "127.0.0.1:9161"
        labels:
          server: "redweb-cloudv"
          service: "FREEPDB1"

  - job_name: 'loki'
    scrape_interval: 30s
    static_configs:
      - targets: ['127.0.0.1:3100']

  - job_name: 'alloy'
    scrape_interval: 30s
    static_configs:
      - targets: ['127.0.0.1:12345']


  - job_name: "blackbox_http"
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [http_200]
    static_configs:
      - targets:
          - "http://127.0.0.1:8080/scuredweb/"
        labels:
          service: scuredweb
      - targets:
          - "http://127.0.0.1:8080/redweb/"
        labels:
          service: redweb
      - targets:
          - "http://127.0.0.1:3100/ready"
        labels:
          service: loki_ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "127.0.0.1:9115"
